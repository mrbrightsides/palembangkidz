<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalembangKidz - Jelajahi Budaya Palembang</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Language Selector -->
    <div class="language-selector">
        <button class="lang-btn active" data-lang="id">🇮🇩 Indonesia</button>
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="plm">🏛️ Palembang</button>
    </div>

    <!-- Audio Control -->
    <button class="audio-control" id="audioControl">
        <span class="audio-icon">🔊</span>
    </button>

    <!-- Home Page -->
    <div id="homePage" class="page active">
        <div class="sky-background">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
            <div class="bird bird1">🐦</div>
            <div class="bird bird2">🐦</div>
        </div>

        <header class="main-header">
            <h1 class="main-title" data-lang-id="Selamat Datang di" data-lang-en="Welcome to" data-lang-plm="Selamat Datang di">
                Selamat Datang di
            </h1>
            <div class="logo-container">
                <img src="logo.svg" alt="PalembangKidz" class="logo-img">
                <h2 class="site-name">PalembangKidz</h2>
            </div>
            <p class="subtitle" data-lang-id="Jelajahi Budaya Palembang Bersama Kami" data-lang-en="Explore Palembang Culture With Us" data-lang-plm="Jelajahi Budaya Palembang Bersamo Kito">
                Jelajahi Budaya Palembang Bersama Kami
            </p>
        </header>

        <main class="content-grid">
            <!-- Pempek -->
            <div class="culture-card" data-culture="pempek">
	    <video class="card-icon" autoplay loop muted playsinline>
		<source src="pempek.mp4" type="video/mp4">
		pempek
	      </video>
	      <h3 data-lang-id="Pempek" data-lang-en="Pempek" data-lang-plm="Pempek">Pempek</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Rumah Adat -->
            <div class="culture-card" data-culture="rumah-adat">
                <video class="card-icon" autoplay loop muted playsinline>
		   <source src="rumah-adat.mp4" type="video/mp4">
		   rumah-adat
                </video>
                <h3 data-lang-id="Rumah Adat" data-lang-en="Traditional House" data-lang-plm="Rumah Limas">Rumah Adat</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Jembatan Ampera -->
            <div class="culture-card" data-culture="jembatan">
		<video class="card-icon" autoplay loop muted playsinline>
		   <source src="jembatan-ampera.mp4" type="video/mp4">
		   jembatan-ampera
                 </video>
                <h3 data-lang-id="Jembatan Ampera" data-lang-en="Ampera Bridge" data-lang-plm="Jembatan Ampera">Jembatan Ampera</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Tari Tradisional -->
            <div class="culture-card" data-culture="tari">
                 <img src="tari-tradisional.png" alt="tari-tradisional" class="card-icon">
                <h3 data-lang-id="Tari Tradisional" data-lang-en="Traditional Dance" data-lang-plm="Tari Gending Sriwijaya">Tari Tradisional</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Kerajaan Sriwijaya -->
            <div class="culture-card" data-culture="sriwijaya">
                <video class="card-icon" autoplay loop muted playsinline>
		   <source src="kerajaan-sriwijaya.mp4" type="video/mp4">
		   kerajaan-sriwijaya
                 </video>
                <h3 data-lang-id="Kerajaan Sriwijaya" data-lang-en="Sriwijaya Kingdom" data-lang-plm="Kerajaan Sriwijaya">Kerajaan Sriwijaya</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Pakaian Adat -->
            <div class="culture-card" data-culture="pakaian">
                 <img src="pakaian-adat.png" alt="pakaian-adat" class="card-icon">
                <h3 data-lang-id="Pakaian Adat" data-lang-en="Traditional Costume" data-lang-plm="Baju Adat">Pakaian Adat</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Alat Musik -->
            <div class="culture-card" data-culture="musik">
                <img src="alat-musik.png" alt="alat-musik" class="card-icon">
                <h3 data-lang-id="Alat Musik" data-lang-en="Musical Instruments" data-lang-plm="Alat Musik">Alat Musik</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Kain Songket -->
            <div class="culture-card" data-culture="songket">
                <img src="kain-songket.png" alt="kain-songket" class="card-icon">
                <h3 data-lang-id="Kain Songket" data-lang-en="Songket Fabric" data-lang-plm="Kain Songket">Kain Songket</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Kisah Sejarah -->
            <div class="culture-card" data-culture="sejarah">
                 <img src="kisah-sejarah.png" alt="kisah-sejarah" class="card-icon">
                <h3 data-lang-id="Kisah Sejarah" data-lang-en="Historical Stories" data-lang-plm="Cerito Sejarah">Kisah Sejarah</h3>
                <div class="card-shine"></div>
            </div>

            <!-- Permainan -->
            <div class="culture-card" data-culture="permainan">
                 <img src="permainan.png" alt="permainan" class="card-icon">
                <h3 data-lang-id="Permainan" data-lang-en="Traditional Games" data-lang-plm="Permainan">Permainan</h3>
                <div class="card-shine"></div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="river-scene">
                <div class="boat">⛵</div>
                <div class="wave"></div>
            </div>
        </footer>
    </div>

    <!-- Content Page Template -->
    <div id="contentPage" class="page">
        <button class="back-button" id="backButton">
            <span>← <span data-lang-id="Kembali" data-lang-en="Back" data-lang-plm="Balik">Kembali</span></span>
        </button>

        <div class="content-container">
            <div class="content-header">
                <h2 id="contentTitle"></h2>
                <button class="narration-button" id="narrationButton">
                    <span class="play-icon">▶️</span>
                    <span data-lang-id="Dengarkan Cerita" data-lang-en="Listen to Story" data-lang-plm="Dengerin Cerito">Dengarkan Cerita</span>
                </button>
            </div>

            <div class="content-body">
                <div class="content-image" id="contentImage"></div>
                <div class="content-text" id="contentText"></div>
            </div>

            <div class="interactive-section">
                <button class="quiz-button" id="quizButton">
                    <span>🎯</span>
                    <span data-lang-id="Main Kuis!" data-lang-en="Play Quiz!" data-lang-plm="Main Kuis!">Main Kuis!</span>
                </button>
                <button class="game-button" id="gameButton">
                    <span>🎮</span>
                    <span data-lang-id="Main Game!" data-lang-en="Play Game!" data-lang-plm="Main Permainan!">Main Game!</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quizModal" class="modal">
        <div class="modal-content quiz-container">
            <button class="close-modal">✖️</button>
            <h2 data-lang-id="Kuis Interaktif" data-lang-en="Interactive Quiz" data-lang-plm="Kuis">Kuis Interaktif</h2>
            <div id="quizContent"></div>
            <div class="quiz-score" id="quizScore"></div>
        </div>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content game-container">
            <button class="close-modal">✖️</button>
            <h2 data-lang-id="Permainan Interaktif" data-lang-en="Interactive Game" data-lang-plm="Permainan">Permainan Interaktif</h2>
            <div id="gameContent"></div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-animation">
            <div class="loading-spinner"></div>
            <p data-lang-id="Memuat..." data-lang-en="Loading..." data-lang-plm="Tunggu ye...">Memuat...</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="audio.js"></script>
    <script src="quiz.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
